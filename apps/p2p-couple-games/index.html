<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Couple Games — Play Together, Anywhere</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #667eea;
    --primary-dark: #5568d3;
    --secondary: #764ba2;
    --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --card-bg: #ffffff;
    --text: #2d2d2d;
    --muted: #6b6b6b;
    --danger: #dc3545;
    --success: #28a745;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-gradient);
    min-height: 100vh;
    color: var(--text);
    padding-bottom: 40px;
  }
  .hidden { display: none !important; }

  /* ---------- Status bar (visible once a room exists) ---------- */
  #status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0,0,0,0.18);
    color: #fff;
    padding: 10px 16px;
    font-size: 0.85rem;
    flex-wrap: wrap;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ffc107; flex-shrink: 0;
  }
  .dot.connected { background: var(--success); }
  .dot.disconnected { background: var(--danger); }
  #ping-text { opacity: 0.8; }
  .status-actions { margin-left: auto; display: flex; gap: 8px; }
  .status-actions button {
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .status-actions button:hover { background: rgba(255,255,255,0.32); }

  main { max-width: 480px; margin: 0 auto; padding: 30px 20px; }

  .screen { display: none; }
  .screen.active { display: block; }

  h1 { text-align: center; color: #fff; margin-bottom: 4px; font-size: 1.8rem; }
  .tagline { text-align: center; color: rgba(255,255,255,0.85); margin-bottom: 24px; }
  h2 { color: #fff; margin-bottom: 16px; text-align: center; }

  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .card h3 { margin-bottom: 12px; color: var(--secondary); }

  input[type="text"] {
    width: 100%;
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 16px;
    margin-bottom: 12px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--primary); }

  button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    transition: transform .15s, background .2s;
  }
  button:hover { background: var(--primary-dark); transform: translateY(-1px); }
  button:disabled { background: #ccc; cursor: not-allowed; transform: none; }

  .error { color: #fff; background: rgba(220,53,69,0.85); padding: 10px; border-radius: 8px; margin-top: 10px; text-align: center; }

  /* ---------- Waiting screen ---------- */
  #screen-waiting .card { text-align: center; }
  .share-box { display: flex; gap: 8px; margin: 14px 0; }
  .share-box input { flex: 1; margin-bottom: 0; background: #f4f2fb; }
  .share-box button { width: auto; flex-shrink: 0; }
  .room-code { font-size: 1rem; color: var(--muted); margin: 10px 0; }
  .room-code strong { font-size: 1.3rem; letter-spacing: 2px; color: var(--secondary); }
  .waiting-msg { margin-top: 14px; color: var(--muted); }
  .spinner {
    width: 26px; height: 26px; margin: 14px auto 0;
    border: 3px solid #e0dcf3; border-top-color: var(--secondary);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Game grid ---------- */
  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
  }
  .game-card {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 20px 10px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    transition: transform .15s;
  }
  .game-card:hover { transform: translateY(-3px); }
  .game-card .icon { font-size: 2rem; display: block; margin-bottom: 8px; }
  .game-card .name { font-weight: 600; font-size: 0.95rem; }

  /* ---------- Active game screen ---------- */
  .game-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
  }
  .game-header button { width: auto; background: rgba(255,255,255,0.25); padding: 8px 14px; }
  .game-header button:hover { background: rgba(255,255,255,0.4); }
  .game-header h2 { flex: 1; margin: 0; }
  #game-root {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 24px 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .loading { text-align: center; color: var(--muted); padding: 30px 0; }
</style>
</head>
<body>

  <header id="status-bar" class="hidden">
    <span id="status-dot" class="dot"></span>
    <span id="status-text">Connecting…</span>
    <span id="ping-text"></span>
    <div class="status-actions">
      <button id="copy-link-btn">🔗 Link</button>
      <button id="leave-room-btn">🚪 Leave</button>
    </div>
  </header>

  <main>
    <!-- ================= LOBBY ================= -->
    <section id="screen-lobby" class="screen active">
      <h1>💜 Couple Games</h1>
      <p class="tagline">Play together, wherever you are</p>

      <div class="card">
        <input type="text" id="nickname-input" placeholder="Your name (optional)">
      </div>

      <div class="card">
        <h3>Start a new room</h3>
        <button id="create-room-btn">Create Room</button>
      </div>

      <div class="card">
        <h3>Join a room</h3>
        <input type="text" id="join-code-input" placeholder="Enter room code">
        <button id="join-room-btn">Join Room</button>
      </div>

      <p id="lobby-error" class="error hidden"></p>
    </section>

    <!-- ================= WAITING / CONNECTING ================= -->
    <section id="screen-waiting" class="screen">
      <div class="card">
        <h3 id="waiting-title">Setting things up…</h3>
        <div id="waiting-share" class="hidden">
          <p>Share this link with your partner:</p>
          <div class="share-box">
            <input type="text" id="share-link-input" readonly>
            <button id="share-copy-btn">Copy</button>
          </div>
          <p class="room-code">Or share the code: <strong id="room-code-display"></strong></p>
        </div>
        <p class="waiting-msg" id="waiting-msg">⏳ Waiting for your partner to join…</p>
        <div class="spinner"></div>
      </div>
      <p id="waiting-error" class="error hidden"></p>
    </section>

    <!-- ================= GAME SELECTION ================= -->
    <section id="screen-games" class="screen">
      <h2>Choose a game</h2>
      <div id="game-grid" class="game-grid"></div>
    </section>

    <!-- ================= ACTIVE GAME ================= -->
    <section id="screen-game" class="screen">
      <div class="game-header">
        <button id="back-to-games-btn">← Games</button>
        <h2 id="game-title"></h2>
      </div>
      <div id="game-root"><p class="loading">Loading…</p></div>
    </section>
  </main>

<script src="app.js"></script>
</body>
</html>
