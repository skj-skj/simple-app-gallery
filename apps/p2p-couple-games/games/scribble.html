<style>
  .scribble-wrap {
    width: min(100%, 760px);
    margin: 0 auto;
    text-align: center;
  }

  .scribble-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .scribble-status {
    font-size: 1rem;
    font-weight: 600;
    min-height: 1.4em;
    text-align: left;
  }

  .scribble-timer {
    font-size: 1.2rem;
    font-weight: 700;
    min-width: 55px;
  }

  .scribble-word {
    min-height: 42px;
    margin-bottom: 10px;
    padding: 9px 14px;
    border-radius: 10px;
    background: #f3f0ff;
    font-size: 1.1rem;
    font-weight: 700;
  }

  .scribble-word.hidden-word {
    color: #666;
    font-weight: 500;
  }

  .scribble-canvas-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    max-height: 65vh;
    background: #fff;
    border: 2px solid #764ba2;
    border-radius: 14px;
    overflow: hidden;
    touch-action: none;
  }

  .scribble-canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    touch-action: none;
  }

  .scribble-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .scribble-controls button {
    min-width: 42px;
  }

  .scribble-color {
    width: 38px;
    height: 38px;
    padding: 3px;
  }

  .scribble-size {
    width: 90px;
  }

  .scribble-guess-area {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .scribble-guess-input {
    flex: 1;
    min-width: 0;
  }

  .scribble-score {
    margin-top: 12px;
    font-size: 0.9rem;
    color: #555;
  }

  .scribble-message {
    margin-top: 8px;
    min-height: 1.4em;
    font-size: 0.95rem;
  }

  .scribble-message.success {
    font-weight: 700;
  }

  .scribble-message.muted {
    color: #777;
  }

  .scribble-disabled {
    opacity: 0.55;
    pointer-events: none;
  }

  @media (max-width: 500px) {
    .scribble-canvas-wrap {
      aspect-ratio: 1 / 1;
    }

    .scribble-top {
      align-items: flex-start;
    }
  }
</style>

<div class="scribble-wrap">
  <div class="scribble-top">
    <div class="scribble-status" id="scribble-status">
      Waiting for round…
    </div>
    <div class="scribble-timer" id="scribble-timer">60</div>
  </div>

  <div class="scribble-word hidden-word" id="scribble-word">
    Waiting…
  </div>

  <div class="scribble-canvas-wrap" id="scribble-canvas-wrap">
    <canvas class="scribble-canvas" id="scribble-canvas"></canvas>
  </div>

  <div class="scribble-controls" id="scribble-draw-controls">
    <button type="button" id="scribble-clear-btn">Clear</button>

    <input
      class="scribble-color"
      id="scribble-color"
      type="color"
      value="#222222"
      title="Brush color"
    >

    <input
      class="scribble-size"
      id="scribble-size"
      type="range"
      min="2"
      max="24"
      value="5"
      title="Brush size"
    >
  </div>

  <div class="scribble-guess-area" id="scribble-guess-area">
    <input
      class="scribble-guess-input"
      id="scribble-guess-input"
      type="text"
      placeholder="Type your guess…"
      autocomplete="off"
      enterkeyhint="send"
    >
    <button type="button" id="scribble-guess-btn">Guess</button>
  </div>

  <div class="scribble-message muted" id="scribble-message"></div>

  <div class="scribble-score" id="scribble-score">
    You 0 — Partner 0
  </div>
</div>
