<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1c2340">
<title>Jain Quiz फ्लैश कार्ड्स</title>
<style>
  /* ============ Design tokens ============ */
  :root{
    --paper:      #f7f1e3;   /* front-of-card, "manuscript" paper */
    --paper-dim:  #efe6d0;
    --ink:        #1c2340;   /* back-of-card, deep indigo ink */
    --ink-soft:   #2c3560;
    --ink-softer: #3a4577;
    --gold:       #c08a28;   /* marigold accent */
    --gold-soft:  #e0b355;
    --maroon:     #8a2f2f;   /* sindoor accent — not-yet-learned / danger */
    --leaf:       #3f7a52;   /* learned / success */
    --text-main:  #241f14;
    --text-sub:   #6b5f45;
    --text-onink: #f2ecd8;
    --text-onink-sub: #b9c0e0;
    --line:       #ddd0af;
    --shadow:     0 6px 20px -6px rgba(28,35,64,0.28);
    --shadow-sm:  0 2px 8px -2px rgba(28,35,64,0.18);
    --radius-lg:  22px;
    --radius-md:  14px;
    --radius-sm:  9px;
    --font-display: "Tiro Devanagari Hindi", "Noto Serif Devanagari", "Kohinoor Devanagari", "Nirmala UI", serif;
    --font-ui:      "Noto Sans Devanagari", "Kohinoor Devanagari", "Nirmala UI", system-ui, -apple-system, "Segoe UI", sans-serif;
    --safe-top:    env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --nav-h: 66px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(192,138,40,0.10), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(138,47,47,0.06), transparent 45%);
    background-attachment: fixed;
    color: var(--text-main);
    font-family: var(--font-ui);
    min-height: 100dvh;
    overscroll-behavior-y: none;
  }
  button{ font-family: inherit; }
  h1,h2,h3{ font-family: var(--font-display); margin:0; }
  p{ margin:0; }
  ::selection{ background: var(--gold-soft); }

  button{ -webkit-user-select:none; user-select:none; cursor:pointer; }
  button:focus-visible, [tabindex]:focus-visible, .card-stage:focus-visible{
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }

  /* ============ App shell ============ */
  #app{
    display:flex;
    flex-direction:column;
    min-height: 100dvh;
  }

  .app-header{
    padding: calc(var(--safe-top) + 14px) 18px 12px;
    display:flex;
    align-items:baseline;
    gap:10px;
    position: sticky;
    top:0;
    z-index: 20;
    background: linear-gradient(var(--paper) 78%, rgba(247,241,227,0));
  }
  .app-header h1{ font-size: 21px; color: var(--ink); letter-spacing:.2px; }
  .app-header .tagline{ font-size:12.5px; color: var(--text-sub); }

  main#app-main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 10px);
  }

  .view{ display:none; flex-direction:column; flex:1; min-height:0; }
  .view.active{ display:flex; }

  /* ============ Bottom nav ============ */
  #bottom-nav{
    position: fixed;
    left:0; right:0; bottom:0;
    height: calc(var(--nav-h) + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    background: rgba(28,35,64,0.97);
    backdrop-filter: blur(6px);
    display:flex;
    z-index: 30;
    box-shadow: 0 -6px 24px -8px rgba(0,0,0,0.35);
  }
  .nav-btn{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    color: var(--text-onink-sub);
    font-size: 11.5px;
    padding: 6px 4px 2px;
  }
  .nav-btn svg{ width:23px; height:23px; }
  .nav-btn.active{ color: var(--gold-soft); }
  .nav-btn .dot{
    width:4px; height:4px; border-radius:50%; background: var(--gold-soft);
    opacity:0; transform: scale(0.5); transition: opacity .15s, transform .15s;
  }
  .nav-btn.active .dot{ opacity:1; transform: scale(1); }

  /* ============ Section list (Home / Full) ============ */
  .scroll-pad{ padding: 4px 16px 24px; overflow-y:auto; flex:1; }

  .section-card{
    background: #fffdf7;
    border:1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 16px 16px 14px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
  }
  .section-card h2{ font-size: 19px; color: var(--ink); line-height:1.35; }
  .section-meta{
    display:flex; flex-wrap:wrap; gap: 8px 14px;
    margin-top:8px; font-size:12.5px; color: var(--text-sub);
  }
  .section-meta b{ color: var(--text-main); font-weight:600; }
  .pill-learned{ color: var(--leaf); font-weight:600; }
  .pill-notyet{ color: var(--maroon); font-weight:600; }

  .progress-track{
    height:8px; border-radius:6px; background: var(--paper-dim);
    margin-top:10px; overflow:hidden; border:1px solid var(--line);
  }
  .progress-fill{
    height:100%; border-radius:6px;
    background: linear-gradient(90deg, var(--gold), var(--leaf));
    transition: width .35s ease;
  }

  .card-actions{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .btn{
    border:none; border-radius: 999px;
    padding: 11px 18px;
    font-size:14.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:7px;
    min-height:44px;
  }
  .btn-primary{ background: var(--ink); color: var(--text-onink); box-shadow: var(--shadow-sm); }
  .btn-primary:active{ background: var(--ink-soft); }
  .btn-ghost{ background: var(--paper-dim); color: var(--text-main); border:1px solid var(--line); }
  .btn-ghost:active{ background: var(--line); }
  .btn-danger{ background: #fff; color: var(--maroon); border:1px solid rgba(138,47,47,0.35); }
  .btn-danger-solid{ background: var(--maroon); color:#fff; }
  .btn-block{ width:100%; justify-content:center; }
  .btn-sm{ padding: 8px 14px; font-size:13px; min-height:38px; }
  .btn[disabled]{ opacity:.45; }

  .expand-toggle{
    display:flex; align-items:center; gap:6px;
    background:none; border:none; color: var(--gold); font-weight:600;
    font-size:13.5px; padding: 10px 2px 2px; min-height:40px;
  }
  .expand-toggle svg{ width:16px; height:16px; transition: transform .2s; }
  .expand-toggle.open svg{ transform: rotate(90deg); }

  .subsection-list{ display:none; margin-top:6px; border-top:1px dashed var(--line); padding-top:8px; }
  .subsection-list.open{ display:block; }
  .subsection-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding: 10px 4px;
    border-bottom: 1px solid var(--paper-dim);
  }
  .subsection-row:last-child{ border-bottom:none; }
  .subsection-info h3{ font-size:14.5px; font-weight:600; color: var(--text-main); font-family: var(--font-ui); }
  .subsection-info .sub-meta{ font-size:11.5px; color: var(--text-sub); margin-top:2px; }
  .subsection-row .btn{ flex-shrink:0; }

  .row-tools{ display:flex; gap:8px; align-items:center; }
  .icon-btn{
    background:none; border:none; padding:8px; color: var(--text-sub);
    display:flex; border-radius:50%;
  }
  .icon-btn svg{ width:18px; height:18px; }
  .icon-btn:active{ background: var(--paper-dim); }

  .empty-note{ text-align:center; color:var(--text-sub); font-size:13.5px; padding: 30px 20px; }

  /* Full view hero */
  .full-hero{
    background: var(--ink); color: var(--text-onink);
    border-radius: var(--radius-lg);
    padding: 20px 18px; margin: 4px 0 16px;
    box-shadow: var(--shadow);
  }
  .full-hero h2{ color:#fff; font-size:20px; }
  .full-hero .sub{ color: var(--text-onink-sub); font-size:13px; margin-top:4px; }
  .full-hero .progress-track{ background: rgba(255,255,255,0.14); border-color: transparent; }
  .full-hero .card-actions{ margin-top:16px; }
  .full-hero .btn-primary{ background: var(--gold); color: var(--ink); }
  .full-hero .btn-ghost{ background: rgba(255,255,255,0.09); color: var(--text-onink); border-color: rgba(255,255,255,0.18); }

  /* ============ Session view ============ */
  .session-header{
    padding: 10px 16px 4px;
    display:flex; flex-direction:column; gap:8px;
  }
  .session-toprow{ display:flex; align-items:center; gap:10px; }
  .session-toprow .icon-btn{ background: var(--paper-dim); }
  .session-titles{ flex:1; min-width:0; }
  .session-titles .s1{ font-size:14px; font-weight:700; color: var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .session-titles .s2{ font-size:12px; color: var(--text-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .session-progress-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; color: var(--text-sub); }
  .session-progress-row .stats{ display:flex; gap:10px; white-space:nowrap; }
  .session-progress-row .progress-track{ flex:1; margin:0; }

  .card-stage{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    padding: 14px 16px 6px;
    min-height: 0;
    perspective: 1600px;
  }
  .card{
    width:100%; max-width: 480px;
    height: min(58vh, 460px);
    position:relative;
  }
  .card-inner{
    position:relative; width:100%; height:100%;
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .card.flipped .card-inner{ transform: rotateY(180deg); }
  .card-face{
    position:absolute; inset:0;
    border-radius: var(--radius-lg);
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    padding: 22px 22px;
    display:flex; flex-direction:column;
    box-shadow: var(--shadow);
    overflow-y:auto;
  }
  .card-front{
    background:
      radial-gradient(circle at 85% -10%, rgba(192,138,40,0.14), transparent 55%),
      var(--paper);
    border: 1px solid var(--line);
    color: var(--text-main);
  }
  .card-back{
    background:
      radial-gradient(circle at 15% -10%, rgba(192,138,40,0.18), transparent 55%),
      var(--ink);
    color: var(--text-onink);
    transform: rotateY(180deg);
  }
  .card-meta{ font-size:11.5px; letter-spacing:.02em; }
  .card-meta .m-section{ font-weight:700; color: var(--gold); text-transform:none; }
  .card-front .card-meta .m-section{ color: var(--maroon); }
  .card-meta .m-sub{ color: var(--text-sub); margin-top:2px; }
  .card-back .card-meta .m-sub{ color: var(--text-onink-sub); }

  .card-question{
    font-family: var(--font-display);
    font-weight:700;
    font-size: clamp(19px, 5.2vw, 25px);
    line-height:1.45;
    margin-top: 14px;
  }
  .card-front .card-question{ flex:1; display:flex; align-items:center; color:#151021; }
  .card-back .card-question{ color: var(--text-onink); font-size: clamp(15px,4vw,17px); margin-top:12px; opacity:.92; }

  .reveal-hint{
    text-align:center; font-size:13px; color: var(--text-sub);
    padding-top:10px; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .reveal-hint svg{ width:15px; height:15px; }

  .card-divider{ height:1px; background: rgba(255,255,255,0.18); margin:14px 0 12px; flex-shrink:0; }
  .card-answer-label{ font-size:11px; letter-spacing:.08em; color: var(--gold-soft); font-weight:700; }
  .card-answer{
    font-family: var(--font-display);
    font-weight:500;
    opacity:.92;
    font-size: clamp(17px, 4.6vw, 21px);
    line-height:1.5;
    margin-top:8px;
    color: var(--text-onink);
  }

  .eval-row{
    padding: 8px 16px calc(14px + var(--safe-bottom)/3);
    display:flex; gap:12px;
    min-height: 66px;
  }
  .eval-btn{
    flex:1; border-radius: var(--radius-md); border:none;
    padding: 14px 10px; font-size:15px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    min-height:58px;
    box-shadow: var(--shadow-sm);
  }
  .eval-btn svg{ width:20px; height:20px; }
  .eval-correct{ background: var(--leaf); color:#fff; }
  .eval-correct:active{ background:#356a46; }
  .eval-wrong{ background:#fff; color: var(--maroon); border: 1.5px solid rgba(138,47,47,0.35); }
  .eval-wrong:active{ background: #f7e9e9; }
  .eval-row.hidden{ visibility:hidden; }

  /* session complete */
  .session-complete{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding: 20px 26px calc(20px + var(--safe-bottom));
  }
  .session-complete .ring{
    width:96px; height:96px; border-radius:50%;
    background: var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-size:15px; font-weight:700;
    margin-bottom:18px; box-shadow: var(--shadow);
  }
  .session-complete h2{ font-size:20px; color: var(--ink); }
  .session-complete p{ color: var(--text-sub); font-size:13.5px; margin-top:6px; }
  .session-complete .card-actions{ margin-top:22px; width:100%; max-width:340px; flex-direction:column; }

  /* ============ Cheat sheet ============ */
  .search-wrap{ padding: 10px 16px 6px; }
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:#fffdf7; border:1px solid var(--line); border-radius:999px;
    padding: 10px 14px;
  }
  .search-box svg{ width:18px; height:18px; color: var(--text-sub); flex-shrink:0; }
  .search-box input{
    border:none; outline:none; background:none; width:100%;
    font-size:15px; font-family: var(--font-ui); color: var(--text-main);
  }
  .cheat-list{ list-style:none; margin:0; padding: 6px 16px 20px; overflow-y:auto; flex:1; }
  .cheat-row{
    display:flex; align-items:center; justify-content:space-between;
    background:#fffdf7; border:1px solid var(--line); border-radius: var(--radius-md);
    padding: 13px 15px; margin-bottom:9px;
    min-height:50px;
  }
  .cheat-row .name{ font-family: var(--font-display); font-size:16.5px; color: var(--text-main); }
  .cheat-row .count{
    font-size:13px; font-weight:700; color: var(--ink);
    background: var(--paper-dim); border-radius:999px; padding:4px 11px; flex-shrink:0; margin-left:10px;
  }
  .cheat-row .count .n{ color: var(--gold); }

  .cheat-detail-header{ padding: 10px 16px 8px; }
  .cheat-detail-title{ font-size:22px; color: var(--ink); margin-top:8px; }
  .cheat-detail-sub{ font-size:13px; color: var(--text-sub); margin-top:3px; }
  .cheat-detail-list{ overflow-y:auto; flex:1; padding: 4px 16px 24px; }
  .cheat-group-title{
    font-size:12.5px; font-weight:700; color: var(--gold); text-transform:none;
    margin: 18px 0 8px; letter-spacing:.02em;
  }
  .cheat-group-title .sub{ display:block; font-size:11.5px; color: var(--text-sub); font-weight:600; margin-top:2px; }
  .cheat-qa{
    background:#fffdf7; border:1px solid var(--line); border-radius: var(--radius-md);
    padding:13px 15px; margin-bottom:9px;
  }
  .cheat-qa .q{ font-family: var(--font-display); font-weight:700; font-size:15px; color: var(--text-main); line-height:1.5; }
  .cheat-qa .a{ font-family: var(--font-display); font-weight:500; opacity:.85; font-size:14px; margin-top:7px; line-height:1.5; color: #3a3220; }

  /* ============ Modal ============ */
  .modal-backdrop{
    position:fixed; inset:0; background: rgba(15,17,32,0.55);
    display:none; align-items:flex-end; justify-content:center;
    z-index: 50; padding: 0;
  }
  .modal-backdrop.open{ display:flex; }
  .modal-sheet{
    background: var(--paper); width:100%; max-width:520px;
    border-radius: 22px 22px 0 0;
    padding: 22px 22px calc(22px + var(--safe-bottom));
    box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
    animation: sheetUp .22s ease;
  }
  @media (min-width:640px){
    .modal-backdrop{ align-items:center; }
    .modal-sheet{ border-radius: 22px; }
  }
  @keyframes sheetUp{ from{ transform: translateY(24px); opacity:0;} to{ transform:none; opacity:1;} }
  .modal-sheet h2{ font-size:19px; color: var(--ink); }
  .modal-sheet .sub{ font-size:13px; color: var(--text-sub); margin-top:5px; }
  .modal-actions{ display:flex; flex-direction:column; gap:10px; margin-top:20px; }
  .modal-actions.row{ flex-direction:row; }
  .mode-option{
    display:flex; align-items:center; gap:12px; width:100%;
    background:#fffdf7; border:1.5px solid var(--line); border-radius: var(--radius-md);
    padding: 14px 15px; text-align:right; min-height:56px;
  }
  .mode-option .ic{
    width:38px; height:38px; border-radius:10px; background: var(--paper-dim);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; color: var(--ink);
  }
  .mode-option .ic svg{ width:20px; height:20px; }
  .mode-option .tt{ font-weight:700; font-size:15px; color: var(--text-main); }
  .mode-option .dd{ font-size:12px; color: var(--text-sub); margin-top:1px; }
  .mode-option:active{ background: var(--paper-dim); }

  /* utility */
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .center-msg{ margin:auto; text-align:center; color:var(--text-sub); font-size:13.5px; padding:30px; }

  @media (min-width: 720px){
    .scroll-pad, .cheat-list, .cheat-detail-list{ max-width:640px; margin:0 auto; width:100%; }
    .session-header, .search-wrap, .cheat-detail-header{ max-width:640px; margin:0 auto; width:100%; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <h1>Jain Quiz फ्लैश कार्ड्स</h1>
    <span class="tagline">जैन प्रश्नोत्तर अभ्यास</span>
  </header>

  <main id="app-main">

    <!-- HOME / SECTIONS -->
    <section id="view-home" class="view active">
      <div class="scroll-pad" id="home-list"></div>
    </section>

    <!-- FULL MODE -->
    <section id="view-full" class="view">
      <div class="scroll-pad" id="full-content"></div>
    </section>

    <!-- CHEAT SHEET -->
    <section id="view-cheatsheet" class="view">
      <div class="search-wrap">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="cheat-search" type="search" placeholder="व्यक्ति खोजें..." aria-label="व्यक्ति खोजें">
        </div>
      </div>
      <ul class="cheat-list" id="cheat-list" aria-live="polite"></ul>
    </section>

    <!-- CHEAT DETAIL -->
    <section id="view-cheat-detail" class="view">
      <div class="cheat-detail-header">
        <button class="icon-btn" id="cheat-detail-back" aria-label="वापस">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h2 class="cheat-detail-title" id="cheat-detail-title"></h2>
        <p class="cheat-detail-sub" id="cheat-detail-sub"></p>
      </div>
      <div class="cheat-detail-list" id="cheat-detail-list"></div>
    </section>

    <!-- SESSION -->
    <section id="view-session" class="view">
      <div class="session-header">
        <div class="session-toprow">
          <button class="icon-btn" id="session-back" aria-label="होम पर जाएं">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="session-titles">
            <div class="s1" id="session-title1">&nbsp;</div>
            <div class="s2" id="session-title2">&nbsp;</div>
          </div>
        </div>
        <div class="session-progress-row">
          <span class="stats" id="session-count">0 / 0</span>
          <div class="progress-track"><div class="progress-fill" id="session-progress-fill" style="width:0%"></div></div>
        </div>
        <div class="session-progress-row" aria-live="polite">
          <span class="stats"><span class="pill-learned" id="session-learned-n">0</span>&nbsp;सीखा · <span class="pill-notyet" id="session-notyet-n">0</span>&nbsp;बाकी</span>
        </div>
      </div>

      <div class="card-stage" id="card-stage">
        <div class="card" id="flash-card" role="button" tabindex="0" aria-label="कार्ड पलटें, उत्तर देखने के लिए टैप करें">
          <div class="card-inner">
            <div class="card-face card-front">
              <div class="card-meta">
                <div class="m-section" id="front-section"></div>
                <div class="m-sub" id="front-subsection"></div>
              </div>
              <div class="card-question" id="front-question"></div>
              <div class="reveal-hint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12s3.5-7 8-7 8 7 8 7-3.5 7-8 7-8-7-8-7z"/><circle cx="12" cy="12" r="2.5"/></svg>
                उत्तर देखने के लिए टैप करें
              </div>
            </div>
            <div class="card-face card-back">
              <div class="card-meta">
                <div class="m-section" id="back-section"></div>
                <div class="m-sub" id="back-subsection"></div>
              </div>
              <div class="card-question" id="back-question"></div>
              <div class="card-divider"></div>
              <div class="card-answer-label">उत्तर</div>
              <div class="card-answer" id="back-answer"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="eval-row hidden" id="eval-row">
        <button class="eval-btn eval-wrong" id="btn-not-yet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          अभी नहीं सीखा
        </button>
        <button class="eval-btn eval-correct" id="btn-correct">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          सही जवाब
        </button>
      </div>

      <div class="session-complete" id="session-complete" style="display:none">
        <div class="ring" id="complete-ring"></div>
        <h2>सत्र पूर्ण हुआ 🎉</h2>
        <p id="complete-detail"></p>
        <div class="card-actions">
          <button class="btn btn-primary btn-block" id="btn-practice-again">फिर से अभ्यास करें</button>
          <button class="btn btn-ghost btn-block" id="btn-complete-home">होम पर जाएं</button>
        </div>
      </div>
    </section>

  </main>

  <nav id="bottom-nav">
    <button class="nav-btn active" data-nav="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
      <span>Sections</span><span class="dot"></span>
    </button>
    <button class="nav-btn" data-nav="full">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="13" height="16" rx="2" transform="rotate(-6 10 13)"/><rect x="7" y="3" width="13" height="16" rx="2"/></svg>
      <span>Full</span><span class="dot"></span>
    </button>
    <button class="nav-btn" data-nav="cheatsheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="9" y1="7" x2="15" y2="7"/></svg>
      <span>Cheat Sheet</span><span class="dot"></span>
    </button>
  </nav>
</div>

<!-- Mode picker modal -->
<div class="modal-backdrop" id="modal-mode">
  <div class="modal-sheet">
    <h2 id="mode-modal-title">अभ्यास मोड चुनें</h2>
    <p class="sub" id="mode-modal-sub"></p>
    <div class="modal-actions">
      <button class="mode-option" id="mode-sequential">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg></span>
        <span><span class="tt">क्रमबद्ध (Sequential)</span><br><span class="dd">मूल क्रम में प्रश्न आएंगे</span></span>
      </button>
      <button class="mode-option" id="mode-random">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg></span>
        <span><span class="tt">यादृच्छिक (Random)</span><br><span class="dd">प्रश्न बेतरतीब क्रम में आएंगे</span></span>
      </button>
      <button class="btn btn-ghost btn-block" id="mode-cancel">रद्द करें</button>
    </div>
  </div>
</div>

<!-- Reset confirm modal -->
<div class="modal-backdrop" id="modal-reset">
  <div class="modal-sheet">
    <h2>क्या आप सुनिश्चित हैं?</h2>
    <p class="sub" id="reset-modal-text">यह चुनी हुई प्रगति को रीसेट कर देगा।</p>
    <div class="modal-actions">
      <button class="btn btn-danger-solid btn-block" id="reset-confirm-btn">रीसेट करें</button>
      <button class="btn btn-ghost btn-block" id="reset-cancel-btn">रद्द करें</button>
    </div>
  </div>
</div>

<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
